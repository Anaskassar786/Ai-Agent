version: '3.8'

services:
  profit-tool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profit-tool-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres_secret@postgres:5432/profit_tool_db?schema=public
      - REDIS_URL=redis://redis:6379/0
      - APP_URL=http://localhost:3000
      - SHOPIFY_API_KEY=shpak_sample_key_18293
      - SHOPIFY_API_SECRET=shpss_sample_shopify_api_secret_49201920
      - JWT_SECRET=jwt_super_secret_enterprise_key_998877
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - profit-net
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: profit-tool-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
      POSTGRES_DB: profit_tool_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profit_tool_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profit-net

  redis:
    image: redis:7-alpine
    container_name: profit-tool-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profit-net

networks:
  profit-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
